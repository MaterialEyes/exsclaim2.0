[project]
name = "exsclaim"
description = "EXSCLAIM! is a library for the automatic EXtraction, Separation, and Caption-based natural Language Annotation of IMages from scientific figures."
authors = [
    { name = "Eric Schwenker", email = "developer@materialeyes.org" },
    { name = "Trevor Spreadbury", email = "developer@materialeyes.org" },
    { name = "Weixin Jiang", email = "developer@materialeyes.org" },
    { name = "Maria Chan", email = "developer@materialeyes.org" },
]
maintainers = [
    { name = "Len Washington III", email = "developer@materialeyes.org" }
]
license-files = [ "LICENSE" ]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Dash",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Text Processing"
]
requires-python = ">=3.13.2"
dynamic = [
    "version",
]
dependencies = [
    # Image manipulation
    "numpy==2.5.2",
    "opencv-contrib-python-headless==5.0.0.93",
    "Pillow==13.0.0",
    "ultralytics==8.4.201",
    "pi_heif==1.4.0",

    # HTTP requests
    "httpx2==2.16.0",
    "brotli==1.2.1",
    "playwright==1.64.1",
    "playwright-stealth==2.0.3",
    "urllib3==2.8.0",
    "beautifulsoup4==4.15.0",
    "tqdm==4.68.3",
    "curl-cffi==0.17.0",

    # Connecting to the PostgreSQL database
    "asyncpg==0.32.0",

    # Used with the Figure Separator
    "cairosvg==2.9.1",
    "pycocotools==2.0.11",

    "PyYAML==6.0.3",
    "pymupdf==1.28.2",

    "torch==2.15.0",
    "torchvision==0.29.2",
    "pytorch-model-summary==0.1.2",

    # Run LLMs
    "openai~=3.42.1",

    # Used with the API
    "dash[async,compress]==4.5.0",
    "flask==3.1.3",
    "dash-extensions==2.0.6",
    "dash-ag-grid==35.3.0",
    "fastapi[standard]==0.162.0",
    "pydantic==2.14.2",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "hypercorn==0.18.0",
    "sqlmodel==0.0.48",
    "sqlalchemy==2.1.6",
    "pydantic_settings==2.16.2",
    "orjson==3.13.0",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",

    "uuid-utils==0.17.0; python_version < '3.14'",

    # Used with the Dashboard
    "dash_bootstrap_components==2.0.4",
    "gunicorn[gevent]==26.2.0",
    "alembic==1.20.1"
]

[project.optional-dependencies]
llm = [
    "ollama~=0.6.2",
    "anthropic~=2.4.0",
    "google-genai~=2.34.0",
    "asksageclient==1.42",
]

telemetry = [
    "prometheus-fastapi-instrumentator==8.1.0"
]

test = [
    "Faker==40.44.0",
    "pytest-asyncio==1.4.1",
    "deepdiff==9.1.0",
    "unidecode==1.4.0",
    "pytest-env==1.7.1"
]

dev = [
    "ipython==9.17.1",
    "pydevd==3.5.0",
    "pydevd_pycharm~=263.7307.101",
    "pytest==9.2.0",
    "scipy-stubs==1.18.1.1",
    "trio==0.34.0",
    "ruff==0.17.3"
]

train = [
    "datasets==5.1.0",
    "huggingface-hub==2.4.0",
    "mlflow==3.17.2"
]

[project.urls]
Homepage = "https://exsclaim.materialeyes.org"
Source = "https://github.com/MaterialEyes/exsclaim2.0"
Documentation = "https://github.com/MaterialEyes/exsclaim2.0/wiki"
Issues = "https://github.com/MaterialEyes/exsclaim2.0/issues"
Paper = "https://arxiv.org/abs/2103.10631"
Changelog = "https://github.com/MaterialEyes/exsclaim2.0/blob/dev/CHANGELIST.md"

[project.scripts]
exsclaim = "exsclaim.__main__:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["exsclaim", "exsclaim.figures", "exsclaim.journals", "exsclaim.llms", "exsclaim.utilities", "exsclaim.api",
    "exsclaim.dashboard", "exsclaim.dashboard.callbacks", "exsclaim.dashboard.components", "exsclaim.dashboard.pages"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "exsclaim.version.version" }

[tools.setuptools.package-data]
"exsclaim" = ["alembic/*", "alembic.ini"]

[tool.ruff]
line-length=127
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["W191", "E501", "I001", "E101"]
