# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
    push:
        branches: [ "main", "dev" ]
    pull_request:
        branches: [ "main" ]

permissions:
    contents: read

jobs:
    build_wheels:
        name: Build wheels for EXSCLAIM! on ${{ matrix.os }} for 3.${{ matrix.major-version }}
        runs-on: ${{ matrix.os }}
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres1!
                    POSTGRES_DB: exsclaim-test-${{ matrix.major-version }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        strategy:
            fail-fast: false
            matrix:
                major-version: [14, 15]
#                os: [ubuntu-latest, windows-latest, windows-11-arm, macos-15-intel, macos-15]
                os: [ubuntu-latest]
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Python ${{ matrix.major-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: "3.${{ matrix.major-version }}"
                  cache: "pip"

            - name: Install UV
              uses: astral-sh/setup-uv@v10.1.0
              with:
                  python-version: "3.${{ matrix.major-version }}"
                  enable-cache: true

            - name: Install dependencies
              run: |
                  uv pip install --system --system-certs flake8 pytest build
                  
                  uv pip install --system --system-certs -r pyproject.toml --extra test --cache-dir=/tmp/pip
                  playwright install chromium

            - name: Remove lazy imports for versions < 3.15
              if: ${{ fromJSON(matrix.major-version) < 15 }}
              run: find ./exsclaim -type f -name "*.py" -exec sed -i 's/^lazy //g' {} +

            - name: Test with pytest
              env:
                  POSTGRES_USER: postgres
                  POSTGRES_DB: "exsclaim-test-${{ matrix.major-version }}"
                  POSTGRES_PASSWORD: postgres1!
                  POSTGRES_HOST: localhost
                  POSTGRES_PORT: 5432
              run: pytest tests

            - name: Build a binary wheel and a source tarball
              run: python3 -m build

            - name: Store the distribution packages
              uses: actions/upload-artifact@v7
              with:
                  name: exsclaim-wheels-${{ matrix.os }}-3.${{ matrix.major-version }}
                  path: dist/

    pypi-publish:
        name: Upload to PyPI
        runs-on: ubuntu-latest
        needs:
            - build_wheels
        environment:
            name: pypi
            url: https://pypi.org/p/exsclaim
        permissions:
            id-token: write
        steps:
            - name: Download all the dists
              uses: actions/download-artifact@v7
              with:
                  pattern: exsclaim-wheels-*
                  path: dist/
                  merge-multiple: true

            - name: Publish distribution to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
